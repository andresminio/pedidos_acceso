name: Check mail (NO USAR — ver nota)

# Este workflow queda DESACTIVADO por diseño: los runners de GitHub
# Actions corren en la nube pública de GitHub y NO pueden llegar a
# webmail.pjn.gov.ar, que solo es accesible desde la red interna /
# VPN del organismo.
#
# En su lugar, el bot se corre a demanda desde una máquina que sí esté
# conectada a esa red — ver mail-bot/revisar_correo.bat y la sección
# "Revisar correo ahora" del README.
#
# Si en algún momento se consigue un runner self-hosted DENTRO de la
# red interna (o la VPN se puede automatizar), este archivo es la base
# para volver a un cron real: cambiar `runs-on` a `self-hosted` y
# descomentar el trigger `schedule`.

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "*/30 * * * *"

jobs:
  check-mail:
    # runs-on: ubuntu-latest  # NO sirve: sin acceso a la red interna
    runs-on: self-hosted # requiere un runner registrado dentro de la red del organismo
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r mail-bot/requirements.txt

      - name: Correr bot de correo
        working-directory: mail-bot
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python main.py
