name: Check mail

# Corre en un runner self-hosted registrado en una PC conectada a la
# red interna del organismo (webmail.pjn.gov.ar solo es accesible desde
# ahí — por eso NO puede ser un runner en la nube de GitHub). El único
# secreto que hace falta acá es BWS_ACCESS_TOKEN: main.py llama a
# secrets_loader.load_secrets(), que trae el resto (IMAP_*, GEMINI_*,
# SUPABASE_*) desde Bitwarden Secrets Manager y sobreescribe
# os.environ — no hace falta (ni sirve) pasarlos acá.
#
# El .bat local (revisar_correo.bat, vía Programador de tareas) puede
# seguir conviviendo con esto mientras se valida que el runner ande
# bien — ver README, sección "Revisar correo ahora".

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 * * * *"

jobs:
  check-mail:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r mail-bot/requirements.txt

      - name: Correr bot de correo
        working-directory: mail-bot
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: python main.py
